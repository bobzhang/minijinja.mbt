[package]
name = "minijinja-oracle"
version = "0.1.0"
edition = "2021"
publish = false

# Differential testing oracle: renders test cases with upstream MiniJinja.
# Features mirror what the MoonBit port implements (insertion ordered maps).
[dependencies]
minijinja = { path = "../../.repos/minijinja/minijinja", features = [
  "preserve_order",
  "loop_controls",
  "json",
  "urlencode",
  "unicode",
] }
# matches what contrib/ ports: no datetime, no full html entity table
minijinja-contrib = { path = "../../.repos/minijinja/minijinja-contrib", features = [
  "pycompat",
  "rand",
  "wordcount",
  "wordwrap",
] }
serde = { version = "1", features = ["derive"] }
unicode-ident = "1.0.5"
serde_json = { version = "1", features = ["preserve_order"] }

[workspace]
